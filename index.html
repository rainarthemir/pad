<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RER Unified Line Viewer</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f4f4;
}
#controls {
  padding: 12px;
  background: white;
  border-bottom: 1px solid #ccc;
  display: flex;
  gap: 10px;
}
#line-container {
  padding: 20px;
}
.station-row {
  display: flex;
  align-items: center;
}
.station-name {
  margin-left: 10px;
}
.main-line {
  width: 4px;
  background: #c0002a;
  margin: 0 20px;
}
.branch-container {
  display: flex;
  margin-left: 40px;
  gap: 30px;
}
.branch-line {
  width: 3px;
  background: #888;
}
.node {
  width: 14px;
  height: 14px;
  background: white;
  border: 4px solid #c0002a;
  border-radius: 50%;
  flex-shrink: 0;
}
.branch-node {
  border-color: #888;
}
.highlight {
  border-color: #00a1ff !important;
}
</style>
</head>
<body>
<div id="controls">
  <label>Main trip: <select id="tripMain"></select></label>
  <label>Variant trip: <select id="tripVar"></select></label>
  <label>Current stop: <select id="currentStop"></select></label>
  <button onclick="renderUnified()">Render</button>
</div>
<div id="line-container"></div>
<script>
let gtfsTrips = {}; // trip_id -> array of {stop_id, stop_name}
let routeColor = "#c0002a";

function setGTFS(data, color) {
  gtfsTrips = data;
  routeColor = color;
  const mainSel = document.getElementById("tripMain");
  const varSel = document.getElementById("tripVar");
  mainSel.innerHTML = "";
  varSel.innerHTML = "";
  Object.keys(gtfsTrips).forEach(t => {
    mainSel.innerHTML += `<option value="${t}">${t}</option>`;
    varSel.innerHTML += `<option value="${t}">${t}</option>`;
  });
  updateCurrentStops();
}

function updateCurrentStops() {
  const t = document.getElementById("tripMain").value;
  const s = document.getElementById("currentStop");
  s.innerHTML = "";
  if (!gtfsTrips[t]) return;
  gtfsTrips[t].forEach(st => {
    s.innerHTML += `<option value="${st.stop_id}">${st.stop_name}</option>`;
  });
}

document.getElementById("tripMain").addEventListener("change", updateCurrentStops);

document.getElementById("tripVar").addEventListener("change", () => {});

function renderUnified() {
  const mainId = document.getElementById("tripMain").value;
  const varId = document.getElementById("tripVar").value;
  const currentStop = document.getElementById("currentStop").value;
  if (!mainId || !varId) return;

  const main = gtfsTrips[mainId];
  const vari = gtfsTrips[varId];

  const mainIds = main.map(s => s.stop_id);
  const varIds = vari.map(s => s.stop_id);

  const common = mainIds.filter(id => varIds.includes(id));
  const divergeIndex = mainIds.findIndex(id => !varIds.includes(id));
  const convergeId = common[common.length - 1];

  const startIndex = mainIds.indexOf(currentStop);
  let container = document.getElementById("line-container");
  container.innerHTML = "";

  let i = startIndex;
  while (i < main.length) {
    const stop = main[i];
    if (stop.stop_id === divergeIndex) break;
    container.appendChild(buildMainNode(stop));
    i++;
  }

  const branchBox = document.createElement("div");
  branchBox.className = "branch-container";
  branchBox.appendChild(buildBranch(main, mainIds, divergeIndex));
  branchBox.appendChild(buildBranch(vari, varIds, divergeIndex));
  container.appendChild(branchBox);

  container.appendChild(buildMainNode(getStop(main, convergeId)));
}

function getStop(arr, id) {
  return arr.find(s => s.stop_id === id);
}

function buildMainNode(stop) {
  let row = document.createElement("div");
  row.className = "station-row";
  let n = document.createElement("div");
  n.className = "node";
  n.style.borderColor = routeColor;
  let name = document.createElement("div");
  name.className = "station-name";
  name.textContent = stop.stop_name;
  row.appendChild(n);
  row.appendChild(name);
  return row;
}

function buildBranch(list, ids, divergeIndex) {
  const box = document.createElement("div");
  ids.forEach(id => {
    let row = document.createElement("div");
    row.className = "station-row";
    let n = document.createElement("div");
    n.className = "node branch-node";
    let name = document.createElement("div");
    name.className = "station-name";
    let st = getStop(list, id);
    if (!st) return;
    name.textContent = st.stop_name;
    row.appendChild(n);
    row.appendChild(name);
    box.appendChild(row);
  });
  return box;
}
</script>
</body>
</html>
