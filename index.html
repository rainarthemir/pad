<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablo RER - Gare de Lyon</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="station-name" id="station-title">Chargement...</h1>
            <div class="line-selector">
                <div class="line-selection">
                    <label for="line1">Ligne 1:</label>
                    <select id="line1">
                        <option value="">-- Chargement --</option>
                    </select>
                    
                    <label for="direction1">Direction 1:</label>
                    <select id="direction1">
                        <option value="">-- Sélectionnez d'abord la ligne --</option>
                    </select>
                </div>
                
                <div class="line-selection">
                    <label for="line2">Ligne 2:</label>
                    <select id="line2">
                        <option value="">-- Chargement --</option>
                    </select>
                    
                    <label for="direction2">Direction 2:</label>
                    <select id="direction2">
                        <option value="">-- Sélectionnez d'abord la ligne --</option>
                    </select>
                </div>
            </div>
        </header>

        <main class="departure-board">
            <div id="departure-list" class="departure-list">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Chargement des données GTFS...</p>
                </div>
            </div>
        </main>
        
        <footer class="footer">
            <div class="update-time">Dernière mise à jour: <span id="update-time">--:--</span></div>
            <div class="station-id">Arrêt ID: <span id="stop-id">...</span></div>
            <div class="data-info">Données GTFS en temps réel</div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
