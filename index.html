<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan RER - Affichage des Lignes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="station-header">
                <h1 class="station-name" id="station-title">Chargement...</h1>
                <div class="stop-id">Arrêt ID: <span id="stop-id">...</span></div>
            </div>
            
            <div class="controls">
                <div class="line-controls">
                    <div class="control-group">
                        <label for="line1">Ligne 1:</label>
                        <select id="line1">
                            <option value="">-- Chargement --</option>
                        </select>
                    </div>
                    
                    <div class="control-group">
                        <label for="direction1">Direction:</label>
                        <select id="direction1">
                            <option value="">-- Sélectionner ligne --</option>
                        </select>
                    </div>
                </div>
                
                <div class="line-controls">
                    <div class="control-group">
                        <label for="line2">Ligne 2:</label>
                        <select id="line2">
                            <option value="">-- Chargement --</option>
                        </select>
                    </div>
                    
                    <div class="control-group">
                        <label for="direction2">Direction:</label>
                        <select id="direction2">
                            <option value="">-- Sélectionner ligne --</option>
                        </select>
                    </div>
                </div>
            </div>
        </header>

        <main class="plan-board">
            <!-- Дисплей будет заполнен схемой маршрутов -->
            <div id="route-display" class="route-display">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Chargement du plan des lignes...</p>
                </div>
            </div>
        </main>
        
        <footer class="footer">
            <div class="update-time">Dernière mise à jour: <span id="update-time">--:--</span></div>
            <div class="info">
                <span class="legend">
                    <span class="legend-line">● Ligne sélectionnée</span>
                    <span class="legend-shared">● Lignes partagées</span>
                    <span class="legend-transfer">↔ Correspondance</span>
                </span>
                <span class="auto-refresh">🔄 Auto-rafraîchissement: 30s</span>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
