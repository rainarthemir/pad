<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan RER - Affichage des Lignes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="station-info">
                <h1 class="station-name" id="station-title">GARE DE LYON RER</h1>
                <div class="stop-info">
                    <span class="stop-id">ID: <span id="stop-id">8775860</span></span>
                    <span class="current-time" id="current-time">--:--</span>
                </div>
            </div>
            
            <div class="controls-panel">
                <div class="line-control">
                    <div class="control-group">
                        <label for="line1">Ligne 1</label>
                        <select id="line1" class="line-select">
                            <option value="">-- Sélection --</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="direction1">Direction</label>
                        <select id="direction1" class="direction-select">
                            <option value="">-- Sélection --</option>
                        </select>
                    </div>
                </div>
                
                <div class="line-control">
                    <div class="control-group">
                        <label for="line2">Ligne 2</label>
                        <select id="line2" class="line-select">
                            <option value="">-- Sélection --</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="direction2">Direction</label>
                        <select id="direction2" class="direction-select">
                            <option value="">-- Sélection --</option>
                        </select>
                    </div>
                </div>
            </div>
        </header>

        <main class="plan-display">
            <div class="display-header">
                <div class="display-title">PLAN DES LIGNES</div>
                <div class="auto-update">🔄 Mise à jour automatique</div>
            </div>
            
            <!-- Контейнер для схемы линий -->
            <div id="lines-scheme" class="lines-scheme">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Chargement du plan des lignes...</p>
                </div>
            </div>
            
            <div class="legend">
                <div class="legend-item">
                    <span class="legend-color shared"></span>
                    <span class="legend-text">Lignes partagées</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color line1-color"></span>
                    <span class="legend-text">Ligne 1 seule</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color line2-color"></span>
                    <span class="legend-text">Ligne 2 seule</span>
                </div>
                <div class="legend-item">
                    <span class="legend-color inactive"></span>
                    <span class="legend-text">Section inactive</span>
                </div>
            </div>
        </main>
        
        <footer class="footer">
            <div class="update-info">
                <span class="update-label">Dernière mise à jour:</span>
                <span class="update-time" id="update-time">--:--</span>
            </div>
            <div class="version">Version GTFS RER</div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
