<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan RER - Affichage des Lignes</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="station-header">
                <h1 class="station-name" id="station-name">GARE DE LYON RER</h1>
                <div class="station-info">
                    <div class="stop-id">ID: <span id="stop-id">8775860</span></div>
                    <div class="current-time" id="current-time">--:--</div>
                </div>
            </div>
            
            <div class="controls">
                <div class="control-panel">
                    <h3>Ligne 1</h3>
                    <div class="select-group">
                        <label for="line1">Ligne:</label>
                        <select id="line1">
                            <option value="">-- Choisir --</option>
                        </select>
                    </div>
                    <div class="select-group">
                        <label for="direction1">Direction:</label>
                        <select id="direction1">
                            <option value="">-- Choisir ligne --</option>
                        </select>
                    </div>
                </div>
                
                <div class="control-panel">
                    <h3>Ligne 2</h3>
                    <div class="select-group">
                        <label for="line2">Ligne:</label>
                        <select id="line2">
                            <option value="">-- Choisir --</option>
                        </select>
                    </div>
                    <div class="select-group">
                        <label for="direction2">Direction:</label>
                        <select id="direction2">
                            <option value="">-- Choisir ligne --</option>
                        </select>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-display">
            <div class="display-title">
                <h2>PLAN DES LIGNES</h2>
                <div class="auto-refresh">🔄 Auto-rafraîchissement</div>
            </div>
            
            <!-- Схема будет здесь -->
            <div id="scheme-container" class="scheme-container">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Chargement des lignes RER...</p>
                </div>
            </div>
            
            <div class="legend">
                <div class="legend-item">
                    <span class="color-box shared"></span>
                    <span class="legend-label">Lignes partagées</span>
                </div>
                <div class="legend-item">
                    <span class="color-box line1"></span>
                    <span class="legend-label">Ligne 1 seule</span>
                </div>
                <div class="legend-item">
                    <span class="color-box line2"></span>
                    <span class="legend-label">Ligne 2 seule</span>
                </div>
            </div>
        </main>
        
        <footer class="footer">
            <div class="update-info">
                <span class="label">Mise à jour:</span>
                <span class="time" id="update-time">--:--</span>
            </div>
            <div class="data-source">Données GTFS RER IDFM</div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
